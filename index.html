<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeShare</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e6e8ee; --muted:#8b93a7; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); font-weight:700; }
  main { max-width:900px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:16px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:#0f1115; border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  input[type=file] { width:100%; }
  textarea { width:100%; min-height:160px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  button { cursor:pointer; background:var(--accent); color:#0b1020; border:0; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .item { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .name { flex:1; word-break:break-all; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .item img { width:48px; height:48px; object-fit:cover; border-radius:6px; }
  a { color:var(--accent); cursor:pointer; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; max-height:60vh; }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; width:min(800px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .narrow { max-width:380px; margin:60px auto; }
  .narrow input { width:100%; margin-bottom:10px; }
  #status { color:var(--muted); font-size:13px; min-height:20px; margin-bottom:12px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><span>&lt;/&gt; CodeShare</span><span id="userbox" class="hidden"><span class="meta" id="who"></span> <button class="ghost" id="logout">Log out</button></span></header>
<main>
  <div id="status"></div>

  <!-- login / register -->
  <div id="authView" class="card narrow hidden">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password (6+ chars)" autocomplete="current-password">
    <div class="row"><button id="loginBtn">Log in</button><button id="registerBtn" class="ghost">Register</button></div>
  </div>

  <!-- logged in but not verified -->
  <div id="verifyView" class="card narrow hidden">
    <h2>Verify your email</h2>
    <p class="meta">We sent a link to your email. Click it, then press the button below. Also, ask the owner to add your email to the allowlist.</p>
    <button id="reloadBtn">I verified, continue</button>
  </div>

  <!-- app -->
  <div id="appView" class="hidden">
    <div class="card">
      <h2>Paste code</h2>
      <div class="row">
        <input id="pTitle" placeholder="Title (e.g. utils.py)">
        <select id="pLang"><option>python</option><option>java</option><option>javascript</option><option>html</option><option>css</option><option>c/c++</option><option>sql</option><option>bash</option><option>other</option></select>
      </div>
      <textarea id="pCode" placeholder="Paste your code here..."></textarea>
      <p><button id="pasteBtn">Share paste</button></p>
    </div>

    <div class="card">
      <h2>Upload files (zip, png, .py, .java, anything)</h2>
      <div class="row"><input type="file" id="fileInput" multiple></div>
      <button id="fileBtn">Upload</button>
    </div>

    <div class="card">
      <h2>Upload a folder (zipped in your browser first)</h2>
      <div class="row"><input type="file" id="folderInput" webkitdirectory directory multiple></div>
      <button id="folderBtn">Upload folder</button>
    </div>

    <div class="card">
      <h2>Shared items</h2>
      <div id="list"></div>
    </div>
  </div>
</main>

<dialog id="viewer">
  <h2 id="vTitle"></h2>
  <pre id="vCode"></pre>
  <div class="row">
    <button id="vCopy">Copy</button>
    <button class="ghost" id="vClose">Close</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

// ====== 1) PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web app) ======
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "...",
  appId: "..."
};
// (This config is not a secret. Security comes from firestore.rules and storage.rules.)

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
const $ = id => document.getElementById(id);
const IMG = /\.(png|jpe?g|gif|webp)$/i;
const SAFE_URL = /^https:\/\/(firebasestorage\.googleapis\.com|[\w-]+\.firebasestorage\.app)\//;
let unsub = null;

const status = (msg, err) => { $("status").textContent = msg || ""; $("status").style.color = err ? "#ff8a8a" : ""; };
const show = name => ["authView","verifyView","appView"].forEach(v => $(v).classList.toggle("hidden", v !== name));
const fail = e => status((e && e.message) || String(e), true);

// ---------- auth ----------
$("loginBtn").onclick = () => signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value).catch(fail);
$("registerBtn").onclick = async () => {
  try {
    const c = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    await sendEmailVerification(c.user);
    status("Account created. Check your email for the verification link.");
  } catch (e) { fail(e); }
};
$("logout").onclick = () => signOut(auth);
$("reloadBtn").onclick = async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); location.reload(); };

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  $("userbox").classList.toggle("hidden", !user);
  if (!user) return show("authView");
  $("who").textContent = user.email;
  if (!user.emailVerified) return show("verifyView");
  show("appView");
  status("");
  const q = query(collection(db, "items"), orderBy("created", "desc"));
  unsub = onSnapshot(q, snap => render(snap.docs), e => fail(new Error("Can't read items. Is your email on the allowlist? (" + e.code + ")")));
});

// ---------- list ----------
function render(docs) {
  const list = $("list");
  list.replaceChildren();
  if (!docs.length) { list.innerHTML = '<p class="meta">Nothing shared yet.</p>'; return; }
  for (const d of docs) {
    const it = d.data(), row = document.createElement("div");
    row.className = "item";

    if (it.kind === "file" && IMG.test(it.name) && SAFE_URL.test(it.url || "")) {
      const img = document.createElement("img"); img.src = it.url; img.alt = ""; row.append(img);
    }

    const nameBox = document.createElement("div"); nameBox.className = "name";
    const title = document.createElement(it.kind === "paste" ? "a" : "span");
    title.textContent = it.name;
    if (it.kind === "paste") title.onclick = () => openPaste(it);
    const meta = document.createElement("div"); meta.className = "meta";
    const when = it.created ? it.created.toDate().toLocaleString() : "just now";
    meta.textContent = `${it.user} · ${when}`;
    nameBox.append(title, meta);

    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = it.kind;
    row.append(nameBox, tag);

    if (it.kind === "paste") {
      const a = document.createElement("a"); a.textContent = "Open"; a.onclick = () => openPaste(it); row.append(a);
    } else if (SAFE_URL.test(it.url || "")) {
      const a = document.createElement("a"); a.textContent = it.kind === "folder" ? "Download .zip" : "Download";
      a.href = it.url; a.target = "_blank"; a.rel = "noopener"; row.append(a);
    }

    if (it.uid === auth.currentUser.uid) {
      const del = document.createElement("button"); del.className = "ghost"; del.textContent = "Delete";
      del.onclick = async () => {
        if (!confirm("Delete this?")) return;
        try {
          if (it.path) await deleteObject(ref(storage, it.path)).catch(() => {});
          await deleteDoc(doc(db, "items", d.id));
        } catch (e) { fail(e); }
      };
      row.append(del);
    }
    list.append(row);
  }
}

function openPaste(it) {
  $("vTitle").textContent = `${it.name} (${it.language || "text"})`;
  $("vCode").textContent = it.content;
  $("vCopy").textContent = "Copy";
  $("viewer").showModal();
}
$("vCopy").onclick = () => navigator.clipboard.writeText($("vCode").textContent).then(() => $("vCopy").textContent = "Copied!");
$("vClose").onclick = () => $("viewer").close();

// ---------- paste ----------
$("pasteBtn").onclick = async () => {
  const code = $("pCode").value;
  if (!code.trim()) return status("Nothing to paste.", true);
  if (code.length > 400000) return status("Paste is too big (max ~400k characters). Upload it as a file instead.", true);
  try {
    await addDoc(collection(db, "items"), {
      kind: "paste", name: $("pTitle").value.trim().slice(0, 100) || "untitled",
      language: $("pLang").value, content: code,
      uid: auth.currentUser.uid, user: auth.currentUser.email.split("@")[0], created: serverTimestamp()
    });
    $("pCode").value = ""; $("pTitle").value = ""; status("Shared!");
  } catch (e) { fail(e); }
};

// ---------- upload ----------
const clean = n => n.replace(/[^\w.\-]+/g, "_").slice(0, 120) || "file";

async function uploadBlob(blob, name, kind) {
  const path = `files/${auth.currentUser.uid}/${crypto.randomUUID().slice(0, 8)}_${clean(name)}`;
  const task = uploadBytesResumable(ref(storage, path), blob);
  await new Promise((res, rej) => task.on("state_changed",
    s => status(`Uploading ${name}: ${Math.round(100 * s.bytesTransferred / s.totalBytes)}%`), rej, res));
  const url = await getDownloadURL(task.snapshot.ref);
  await addDoc(collection(db, "items"), {
    kind, name, path, url, size: blob.size,
    uid: auth.currentUser.uid, user: auth.currentUser.email.split("@")[0], created: serverTimestamp()
  });
}

$("fileBtn").onclick = async () => {
  const files = [...$("fileInput").files];
  if (!files.length) return status("No file selected.", true);
  try {
    for (const f of files) await uploadBlob(f, f.name, "file");
    $("fileInput").value = ""; status(`Uploaded ${files.length} file(s).`);
  } catch (e) { fail(e); }
};

$("folderBtn").onclick = async () => {
  const files = [...$("folderInput").files];
  if (!files.length) return status("No folder selected.", true);
  try {
    status("Zipping folder...");
    const zip = new JSZip();
    for (const f of files) zip.file(f.webkitRelativePath || f.name, f);
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    const root = (files[0].webkitRelativePath || "folder").split("/")[0];
    await uploadBlob(blob, root + ".zip", "folder");
    $("folderInput").value = ""; status(`Uploaded folder '${root}'.`);
  } catch (e) { fail(e); }
};
</script>
</body>
</html>
